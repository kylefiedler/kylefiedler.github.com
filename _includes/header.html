<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">

    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="preload" href="/fonts/basiercirclemono-regular-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/stylesheets/site.css">
  </head>

  <body data-section="{{ page.section }}"{% if page.class %} class="{{ page.class }}"{% endif %}>
