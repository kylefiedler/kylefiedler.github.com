{%- comment -%}
  The photo wall on Split pages. `wall` (from the layout, else the page) names
  a set in _data/walls/ (written by script/wall-photos) and falls back to the
  gray placeholder set.
  Entries without a `src` render as gray tiles.

  The set goes out once in a <template>; the script below deals it into
  columns sized to the wall, so the wall adds columns as the window widens
  (two on medium screens, up to five on very wide ones) and each column's
  track only runs a little past the window's height. Very tall tracks are
  costly to keep painted, and Safari leaves them blank while they drift.

  Photos are dealt round-robin, cycling through the set until every photo is
  used and each column outruns the window plus its stagger. When the set and
  the column count share a factor, each pass through the set shifts by one
  photo; otherwise some columns would cycle the same few. Each column's
  track holds two copies of its tiles, and the drift moves every tile by
  exactly one copy, so the loop has no seam. Resizing re-deals only when the column
  count changes or a column no longer reaches the bottom of the window.

  Screen readers get each photo's alt once, on its first appearance. Repeats
  and the second copy are silent, and so are photos whose alt is empty.
  Phones get wall-strip.html under the nav instead.

  `wall: static` renders three empty, still columns that scroll with the page,
  for case studies to fill with their own media.
{%- endcomment -%}
{%- assign wall = layout.wall | default: page.wall -%}
{%- if wall == "static" -%}
<div class="wall wall--static">
  <div class="wall__column"></div>
  <div class="wall__column"></div>
  <div class="wall__column"></div>
</div>
{%- else -%}
{%- assign photos = site.data.walls[wall] | default: site.data.walls.placeholder -%}
<div class="wall wall--drift">
  <template>
    {%- for photo in photos %}
    {% include wall-tile.html photo=photo alt=photo.alt %}
    {%- endfor %}
  </template>
</div>
<script>
  (() => {
    const wall = document.querySelector(".wall--drift");
    const photos = [...wall.querySelector("template").content.children];
    // Column widths, left to right. A wall of n columns uses the first n.
    const shares = [1.6, 1.17, 1, 1.35, 1.1];
    // Deepest column stagger in _wall.scss, plus a little.
    const stagger = 96;
    const gcd = (a, b) => (b ? gcd(b, a % b) : a);
    // About one column per 300px of wall.
    const columnsFor = (width) => Math.min(shares.length, Math.max(2, Math.round(width / 300)));
    let count = 0;

    const deal = (width, height) => {
      count = columnsFor(width);
      const used = shares.slice(0, count);
      const gap = parseFloat(getComputedStyle(wall).columnGap) || 0;
      const unit = (width - gap * (count - 1)) / used.reduce((a, b) => a + b);
      // Headroom so small resizes don't re-deal.
      const reach = height * 1.25 + stagger;
      const step = gcd(photos.length, count) > 1 ? 1 : 0;

      wall.style.gridTemplateColumns = used.map((share) => `${share}fr`).join(" ");
      wall.querySelectorAll(".wall__column").forEach((column) => column.remove());

      used.forEach((share, index) => {
        const copy = document.createElement("div");
        copy.className = "wall__copy";
        let length = 0;
        for (let slot = index; slot < photos.length || length * share * unit < reach; slot += count) {
          const tile = photos[(slot + Math.floor(slot / photos.length) * step) % photos.length].cloneNode(true);
          if (slot >= photos.length && tile instanceof HTMLImageElement) tile.alt = "";
          copy.append(tile);
          length += Number(tile.dataset.ratio);
        }
        const echo = copy.cloneNode(true);
        echo.setAttribute("aria-hidden", "true");
        echo.querySelectorAll("img").forEach((img) => (img.alt = ""));

        const track = document.createElement("div");
        track.className = "wall__track";
        track.append(copy, echo);
        const column = document.createElement("div");
        column.className = "wall__column";
        column.style.setProperty("--wall-length", length.toFixed(3));
        column.style.setProperty("--wall-share", share);
        column.style.setProperty("--wall-tiles", copy.childElementCount);
        column.append(track);
        wall.append(column);
      });
    };

    new ResizeObserver(() => {
      const { clientWidth: width, clientHeight: height } = wall;
      // Hidden on phones; deal once the wall shows.
      if (!width) return;
      const short = [...wall.querySelectorAll(".wall__copy:first-child")].some((copy) => copy.offsetHeight < height + stagger);
      if (columnsFor(width) !== count || short) deal(width, height);
    }).observe(wall);
  })();
</script>
{%- endif -%}
