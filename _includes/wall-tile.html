{%- assign ratio = include.photo.height | times: 1.0 | divided_by: include.photo.width | round: 4 -%}
{%- if include.photo.src %}
<img class="wall__tile" src="{{ include.photo.src }}" alt="{{ include.alt | escape }}" width="{{ include.photo.width }}" height="{{ include.photo.height }}" data-ratio="{{ ratio }}" loading="lazy" decoding="async">
{%- else %}
<div class="wall__tile" style="aspect-ratio: {{ include.photo.width }} / {{ include.photo.height }}" data-ratio="{{ ratio }}"></div>
{%- endif -%}
