title: Kyle Fiedler
description: Probably eating a taco

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

sass:
  sass_dir: _sass
  style: :compressed

exclude:
  - README
  - node_modules
  - script
  - test

# Long-form entries, named like posts: _journal/YYYY-MM-DD-title.md. Without a
# filename or front-matter date, an entry is dated at build time.
collections:
  journal:
    output: true
    permalink: /journal/:title/

# `section` keys into _data/sections.yml. `frame` is `sheet` (full width) or
# `split` (card beside the photo wall).
defaults:
  - scope:
      path: ""
    values:
      section: index
      frame: sheet
  - scope:
      path: ""
      type: posts
    values:
      section: journal
      layout: post
  - scope:
      path: ""
      type: journal
    values:
      section: journal
      layout: post
  - scope:
      path: journal
    values:
      section: journal
  - scope:
      path: lists
    values:
      section: lists
  - scope:
      path: work
    values:
      section: work
